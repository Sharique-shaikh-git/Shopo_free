<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#ffffff",
                    "secondary-container": "#5dfd8a",
                    "primary": "#005147",
                    "surface-container-high": "#e8e8ea",
                    "on-primary-container": "#95e8d8",
                    "surface-container-low": "#f3f3f6",
                    "inverse-on-surface": "#f0f0f3",
                    "tertiary-fixed": "#dae2ff",
                    "secondary-fixed": "#66ff8e",
                    "tertiary-container": "#0055d4",
                    "primary-container": "#006b5e",
                    "error": "#ba1a1a",
                    "on-surface": "#1a1c1e",
                    "on-surface-variant": "#3e4946",
                    "primary-fixed": "#9ff2e1",
                    "on-error-container": "#93000a",
                    "surface-variant": "#e2e2e5",
                    "surface-container": "#eeeef0",
                    "surface": "#f9f9fc",
                    "on-primary-fixed-variant": "#005046",
                    "on-secondary-fixed": "#002109",
                    "outline": "#6e7976",
                    "surface-container-highest": "#e2e2e5",
                    "on-error": "#ffffff",
                    "whatsapp-green": "#25D366",
                    "on-secondary-container": "#007232",
                    "on-tertiary-fixed-variant": "#003fa3",
                    "status-shipped": "#F0FDF4",
                    "growth-green": "#006B5E",
                    "trust-blue": "#0055D4",
                    "on-secondary-fixed-variant": "#005322",
                    "surface-dim": "#dadadc",
                    "secondary": "#006d2f",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#003fa3",
                    "error-red": "#BA1A1A",
                    "outline-variant": "#bec9c5",
                    "status-pending": "#FEF7FF",
                    "surface-tint": "#006b5e",
                    "inverse-surface": "#2f3133",
                    "surface-bright": "#f9f9fc",
                    "on-secondary": "#ffffff",
                    "on-tertiary-fixed": "#001848",
                    "on-background": "#1a1c1e",
                    "background": "#f9f9fc",
                    "surface-gray": "#F8F9FA",
                    "border-subtle": "#E1E3E5",
                    "on-tertiary-container": "#ccd8ff",
                    "on-primary-fixed": "#00201b",
                    "primary-fixed-dim": "#83d5c5",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#83d5c5",
                    "tertiary-fixed-dim": "#b2c5ff",
                    "secondary-fixed-dim": "#3de273"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target-min": "3rem",
                    "stack-md": "1rem",
                    "gutter-mobile": "1rem",
                    "stack-sm": "0.5rem",
                    "margin-mobile": "1.25rem",
                    "stack-lg": "2rem"
            },
            "fontFamily": {
                    "label-sm": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "label-lg": ["Be Vietnam Pro"],
                    "headline-lg-mobile": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "headline-md": ["Be Vietnam Pro"],
                    "headline-lg": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                    "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                    "headline-lg": ["32px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col pb-32">
<!-- TopAppBar (Transactional - Shell Navigation Suppressed) -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-subtle flex items-center justify-between px-gutter-mobile h-touch-target-min transition-colors duration-200">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Checkout</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Canvas -->
<main class="flex-grow mt-20 px-gutter-mobile flex flex-col space-y-stack-lg max-w-2xl mx-auto w-full">
<!-- Delivery Address -->
<section class="flex flex-col space-y-stack-sm">
<div class="flex items-center justify-between">
<h2 class="font-label-lg text-label-lg text-on-surface uppercase tracking-wider">Delivery Address</h2>
<button aria-label="Edit address" class="text-trust-blue flex items-center p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
</button>
</div>
<div class="bg-surface-container-lowest border border-border-subtle rounded-lg p-stack-md flex items-start space-x-3">
<span class="material-symbols-outlined text-primary mt-1 icon-fill" data-icon="location_on">location_on</span>
<div class="flex flex-col">
<p class="font-body-md text-body-md text-on-surface font-semibold">Ahmed Khan</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">+92 300 1234567</p>
<p class="font-body-md text-body-md text-on-surface-variant">Islamabad</p>
</div>
</div>
</section>
<!-- Delivery Options -->
<section class="flex flex-col space-y-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface uppercase tracking-wider">Delivery Options</h2>
<div class="bg-surface-container-lowest border border-growth-green rounded-lg p-stack-md flex items-center justify-between cursor-pointer ring-1 ring-growth-green">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-growth-green icon-fill" data-icon="check_circle">check_circle</span>
<div class="flex flex-col">
<p class="font-body-md text-body-md text-on-surface font-medium">Standard Delivery (2-3 days)</p>
</div>
</div>
<span class="font-label-lg text-label-lg text-growth-green uppercase">Free</span>
</div>
</section>
<!-- Payment Methods -->
<section class="flex flex-col space-y-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface uppercase tracking-wider">Payment Method</h2>
<div class="bg-surface-container-lowest border border-border-subtle rounded-lg divide-y divide-border-subtle overflow-hidden">
<label class="flex items-center space-x-4 p-stack-md cursor-pointer hover:bg-surface-container-low transition-colors">
<input checked="" class="w-5 h-5 text-growth-green border-outline focus:ring-growth-green focus:ring-offset-surface" name="payment" type="radio" value="cod"/>
<div class="flex items-center space-x-3 flex-grow">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="payments">payments</span>
<span class="font-body-md text-body-md text-on-surface">Cash on Delivery</span>
</div>
</label>
<label class="flex items-center space-x-4 p-stack-md cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-growth-green border-outline focus:ring-growth-green focus:ring-offset-surface" name="payment" type="radio" value="jazzcash"/>
<div class="flex items-center space-x-3 flex-grow">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-body-md text-body-md text-on-surface">JazzCash</span>
</div>
</label>
<label class="flex items-center space-x-4 p-stack-md cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="w-5 h-5 text-growth-green border-outline focus:ring-growth-green focus:ring-offset-surface" name="payment" type="radio" value="easypaisa"/>
<div class="flex items-center space-x-3 flex-grow">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-body-md text-body-md text-on-surface">EasyPaisa</span>
</div>
</label>
</div>
</section>
</main>
<!-- Bottom Action Bar (Thumb Zone) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border-subtle p-gutter-mobile z-40 flex flex-col space-y-stack-sm pb-8 shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
<div class="flex items-center justify-between max-w-2xl mx-auto w-full px-2">
<span class="font-body-md text-body-md text-on-surface-variant">Total Payment</span>
<span class="font-headline-md text-headline-md text-primary">PKR 2,050</span>
</div>
<div class="max-w-2xl mx-auto w-full">
<button class="w-full bg-growth-green text-on-primary font-label-lg text-label-lg rounded-lg h-14 flex items-center justify-center hover:bg-primary-container active:scale-[0.98] transition-all">
                Place Order
            </button>
</div>
</div>
</body></html>
