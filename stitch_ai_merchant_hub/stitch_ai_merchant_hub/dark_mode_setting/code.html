<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Dark Mode Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#3e4946",
                    "tertiary-container": "#0055d4",
                    "surface-variant": "#e2e2e5",
                    "on-secondary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-secondary-container": "#007232",
                    "tertiary-fixed": "#dae2ff",
                    "on-secondary-fixed-variant": "#005322",
                    "inverse-surface": "#2f3133",
                    "inverse-on-surface": "#f0f0f3",
                    "error-red": "#BA1A1A",
                    "trust-blue": "#0055D4",
                    "on-surface": "#1a1c1e",
                    "on-primary-fixed": "#00201b",
                    "primary": "#005147",
                    "surface-container-low": "#f3f3f6",
                    "on-primary-fixed-variant": "#005046",
                    "surface-dim": "#dadadc",
                    "on-tertiary-container": "#ccd8ff",
                    "on-tertiary-fixed": "#001848",
                    "on-primary-container": "#95e8d8",
                    "error": "#ba1a1a",
                    "surface-gray": "#F8F9FA",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#006b5e",
                    "on-background": "#1a1c1e",
                    "whatsapp-green": "#25D366",
                    "secondary-container": "#5dfd8a",
                    "surface": "#f9f9fc",
                    "outline-variant": "#bec9c5",
                    "outline": "#6e7976",
                    "error-container": "#ffdad6",
                    "tertiary": "#003fa3",
                    "tertiary-fixed-dim": "#b2c5ff",
                    "secondary-fixed": "#66ff8e",
                    "primary-fixed-dim": "#83d5c5",
                    "surface-bright": "#f9f9fc",
                    "surface-container-high": "#e8e8ea",
                    "growth-green": "#006B5E",
                    "secondary": "#006d2f",
                    "surface-container-highest": "#e2e2e5",
                    "primary-fixed": "#9ff2e1",
                    "on-error-container": "#93000a",
                    "status-pending": "#FEF7FF",
                    "on-secondary-fixed": "#002109",
                    "on-tertiary-fixed-variant": "#003fa3",
                    "on-primary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "surface-tint": "#006b5e",
                    "border-subtle": "#E1E3E5",
                    "inverse-primary": "#83d5c5",
                    "background": "#f9f9fc",
                    "status-shipped": "#F0FDF4",
                    "secondary-fixed-dim": "#3de273",
                    "surface-container": "#eeeef0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "1rem",
                    "touch-target-min": "3rem",
                    "stack-lg": "2rem",
                    "margin-mobile": "1.25rem",
                    "gutter-mobile": "1rem",
                    "stack-sm": "0.5rem"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Be Vietnam Pro"],
                    "headline-md": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "label-sm": ["Be Vietnam Pro"],
                    "headline-lg": ["Be Vietnam Pro"],
                    "label-lg": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-on-background bg-surface-gray dark:bg-surface-dim flat no shadows flex justify-between items-center px-gutter-mobile py-4 z-40">
<button aria-label="Go back" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-growth-green dark:text-primary-fixed-dim">Dark Mode</h1>
<div class="h-touch-target-min w-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow px-margin-mobile py-stack-md flex flex-col gap-stack-lg overflow-y-auto">
<!-- Preview Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant">Appearance Preview</h2>
<div class="w-full h-48 rounded-xl border border-border-subtle overflow-hidden flex relative shadow-sm">
<!-- Light Half -->
<div class="w-1/2 h-full bg-surface-container-lowest p-4 border-r border-border-subtle">
<div class="w-full h-8 bg-surface-container-low rounded-lg mb-4"></div>
<div class="w-3/4 h-4 bg-surface-container-highest rounded mb-2"></div>
<div class="w-1/2 h-4 bg-surface-container-highest rounded"></div>
<div class="absolute bottom-4 left-4 w-12 h-12 bg-primary-container rounded-full"></div>
</div>
<!-- Dark Half -->
<div class="w-1/2 h-full bg-inverse-surface p-4">
<div class="w-full h-8 bg-on-surface-variant rounded-lg mb-4 opacity-50"></div>
<div class="w-3/4 h-4 bg-on-surface-variant rounded mb-2 opacity-30"></div>
<div class="w-1/2 h-4 bg-on-surface-variant rounded opacity-30"></div>
<div class="absolute bottom-4 right-4 w-12 h-12 bg-inverse-primary rounded-full"></div>
</div>
</div>
</section>
<!-- Selection Section -->
<section class="flex flex-col gap-stack-md">
<!-- Light Mode Option (Selected) -->
<button class="w-full text-left rounded-xl border-2 border-primary bg-surface-container-lowest p-4 flex items-center justify-between shadow-sm transition-all active:scale-95">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="light_mode">light_mode</span>
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold">Light Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Clean and bright</p>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Dark Mode Option -->
<button class="w-full text-left rounded-xl border border-border-subtle bg-surface-container-lowest p-4 flex items-center justify-between hover:bg-surface-container-low transition-all active:scale-95">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-inverse-surface flex items-center justify-center text-inverse-on-surface">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-surface">Dark Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Easy on the eyes</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</button>
<!-- System Default Option -->
<button class="w-full text-left rounded-xl border border-border-subtle bg-surface-container-lowest p-4 flex items-center justify-between hover:bg-surface-container-low transition-all active:scale-95">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full flex overflow-hidden border border-border-subtle">
<div class="w-1/2 h-full bg-surface-container-lowest flex items-center justify-end pr-1 text-on-surface">
<span class="material-symbols-outlined text-[16px]" data-icon="phone_iphone">phone_iphone</span>
</div>
<div class="w-1/2 h-full bg-inverse-surface flex items-center justify-start pl-1 text-inverse-on-surface">
<!-- partial icon effect approximated -->
</div>
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-surface">System Default</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Matches device settings</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</button>
</section>
</main>
</body></html>
