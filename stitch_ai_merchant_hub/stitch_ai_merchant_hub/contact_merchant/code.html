<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Merchant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {
                extend: {
                    "colors": {

                        "error-red": "#BA1A1A",

                        "on-surface": "#1a1c1e",

                        "surface-dim": "#dadadc",

                        "surface-container-lowest": "#ffffff",

                        "on-background": "#1a1c1e",
                        "whatsapp-green": "#25D366",
                        "secondary-container": "#5dfd8a",
                        "surface": "#f9f9fc",
                        "outline-variant": "#bec9c5",
                        "outline": "#6e7976",
                        "error-container": "#ffdad6",

                        "tertiary-fixed-dim": "#b2c5ff",
                        "secondary-fixed": "#66ff8e",
                        "primary-fixed-dim": "#83d5c5",
                        "surface-bright": "#f9f9fc",
                        "surface-container-high": "#e8e8ea",
                        "growth-green": "#006B5E",
                        "secondary": "#006d2f",
                        "surface-container-highest": "#e2e2e5",
                        "primary-fixed": "#9ff2e1",

                        "border-subtle": "#E1E3E5",
                        "inverse-primary": "#83d5c5",
                        "background": "#f9f9fc",
                        "status-shipped": "#F0FDF4",
                        "secondary-fixed-dim": "#3de273",
                        "surface-container": "#eeeef0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "touch-target-min": "3rem",
                        "stack-lg": "2rem",
                        "margin-mobile": "1.25rem",
                        "gutter-mobile": "1rem",
                        "stack-sm": "0.5rem"
                    },
                    "fontFamily": {

                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }]

<style>
        body {
            background-color: #f9f9fc; /* background */
            color: #1a1c1e; /* on-background */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Top Navigation (Custom App Bar for Sub-page) -->
<header class="sticky top-0 bg-surface z-50 px-gutter-mobile py-4 flex items-center gap-4">
<button class="w-12 h-12 flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center gap-3 flex-1">
<img class="w-10 h-10 rounded-full object-cover border border-border-subtle bg-white" data-alt="A modern, abstract circular logo for a digital store named Kinetic Growth, featuring a stylized leaf motif in shades of deep green and vibrant teal against a pure white background. The logo sits perfectly centered, exuding trust, natural progression, and e-commerce professionalism in a high-key light mode setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_Y7XFoDzNZiHyACsBvX0LU6knwobOZYVuURtKJEUdclh6iH5Q_-zJrG-KTIO7Z-4nj66TlRxAz8RT9rCoAUtRU0XNC7u_pStqZnmvIKO8Uh5PRPHOgdENGsc00lPpExOu3XAdPL7TX2NMSLEojkb5OODxgzCP2UaT3eexA3BXu0SO-asXxpD6k06ykr9KOPN32axRzsFDp2Z-0sKA23Qn30BZ7xfhaZ99TuWlgKgKpzoVC6x7Zyov0LdZfSK7eUi8yjcG8NBd3_8"/>
<h1 class="font-headline-md text-headline-md text-on-surface">Kinetic Growth</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-gutter-mobile py-6 flex flex-col gap-stack-lg pb-32">
<!-- Merchant Info Card -->
<section class="bg-surface-container-lowest rounded-xl border border-border-subtle p-stack-md flex flex-col gap-4">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
</div>
<div class="flex-1">
<h2 class="font-body-lg text-body-lg font-bold text-on-surface mb-1">Contact Details</h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="call">call</span>
                        +92 300 1234567
                    </p>
</div>
</div>
<div class="bg-surface-gray rounded-lg p-3 flex items-center gap-2 border border-surface-dim">
<span class="material-symbols-outlined text-growth-green" data-icon="schedule" data-weight="fill" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-sm text-label-sm text-on-surface">Usually replies in 5 mins</span>
</div>
</section>
<!-- Quick Questions -->
<section class="flex flex-col gap-stack-sm">
<h3 class="font-label-lg text-label-lg text-on-surface-variant mb-2">Quick Questions</h3>
<div class="flex flex-col gap-3">
<button class="bg-surface-container-lowest border border-border-subtle rounded-full px-6 py-3 text-left font-body-md text-body-md text-on-surface hover:bg-surface-container-low active:bg-surface-container-high transition-colors flex items-center justify-between">
                    Is this item available?
                    <span class="material-symbols-outlined text-outline-variant text-sm" data-icon="arrow_forward_ios">arrow_forward_ios</span>
</button>
<button class="bg-surface-container-lowest border border-border-subtle rounded-full px-6 py-3 text-left font-body-md text-body-md text-on-surface hover:bg-surface-container-low active:bg-surface-container-high transition-colors flex items-center justify-between">
                    What is the delivery time?
                    <span class="material-symbols-outlined text-outline-variant text-sm" data-icon="arrow_forward_ios">arrow_forward_ios</span>
</button>
<button class="bg-surface-container-lowest border border-border-subtle rounded-full px-6 py-3 text-left font-body-md text-body-md text-on-surface hover:bg-surface-container-low active:bg-surface-container-high transition-colors flex items-center justify-between">
                    Can I get a discount?
                    <span class="material-symbols-outlined text-outline-variant text-sm" data-icon="arrow_forward_ios">arrow_forward_ios</span>
</button>
</div>
</section>
<!-- Primary Actions Group -->
<section class="flex flex-col gap-4 mt-4">
<button class="w-full h-[56px] min-h-[56px] rounded-lg bg-whatsapp-green text-white font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm">
<!-- Using a generic chat icon as placeholder for WhatsApp since specific brand icons might not be in material symbols -->
<span class="material-symbols-outlined" data-icon="chat" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat</span>
                Chat on WhatsApp
            </button>
<button class="w-full h-[56px] min-h-[56px] rounded-lg border-2 border-trust-blue text-trust-blue font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-95 transition-transform bg-transparent hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="phone_in_talk">phone_in_talk</span>
                Call Now
            </button>
</section>
</main>
<!-- Bottom Message Input (Fixed) -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-border-subtle p-gutter-mobile pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-low border border-border-subtle rounded-full pl-6 pr-14 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" placeholder="Type a message..." type="text"/>
<button class="absolute right-2 w-10 h-10 rounded-full bg-growth-green flex items-center justify-center text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm ml-1" data-icon="send" data-weight="fill" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</body></html>
