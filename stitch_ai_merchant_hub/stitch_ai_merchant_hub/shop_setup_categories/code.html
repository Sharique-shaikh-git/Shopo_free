<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background-color: #f0fdf4;
        }

            opacity: 1;
        }
        .ai-pulse-text {
            animation: pulse-text 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-text {

            50% { color: #3de273; opacity: 0.7; }
        }

        .page-container {
            max-width: 480px;

<body class="bg-surface text-on-surface">
<div class="page-container bg-white relative">
<!-- TopAppBar: Identity from JSON -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-on-background flex justify-between items-center px-gutter-mobile py-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-growth-green dark:text-primary-fixed-dim" data-icon="storefront">storefront</span>
<h1 class="font-headline-md text-headline-md font-bold text-growth-green">Shop Builder</h1>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full" data-icon="language">language</button>
</header>
<!-- Main Content: The Setup Step -->
<main class="flex-1 px-gutter-mobile pt-stack-md pb-32">
<!-- Step Progress Indicator -->
<div class="flex gap-2 mb-stack-lg">
<div class="h-1.5 flex-1 bg-growth-green rounded-full"></div>
<div class="h-1.5 flex-1 bg-growth-green rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-variant rounded-full"></div>
</div>
<!-- Headline Section -->
<section class="mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">What do you sell?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select all categories that apply to your business. This helps us tailor your store's features.</p>
</section>
<!-- Multi-select Bento Grid -->
<div class="grid grid-cols-2 gap-4" id="category-grid">
<!-- Category: Electronics -->
<button class="category-card flex flex-col items-start p-4 bg-white border border-border-subtle rounded-xl text-left transition-all duration-200 active:scale-95 group relative overflow-hidden" onclick="toggleCategory(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-growth-green" data-icon="devices">devices</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Electronics</span>
<div class="check-icon absolute top-3 right-3 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-growth-green" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Category: Apparel -->
<button class="category-card flex flex-col items-start p-4 bg-white border border-border-subtle rounded-xl text-left transition-all duration-200 active:scale-95 group relative overflow-hidden" onclick="toggleCategory(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-growth-green" data-icon="apparel">apparel</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Apparel</span>
<div class="check-icon absolute top-3 right-3 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-growth-green" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Category: Home & Living -->
<button class="category-card flex flex-col items-start p-4 bg-white border border-border-subtle rounded-xl text-left transition-all duration-200 active:scale-95 group relative overflow-hidden" onclick="toggleCategory(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-growth-green" data-icon="home_work">home_work</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Home &amp; Living</span>
<div class="check-icon absolute top-3 right-3 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-growth-green" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Category: Groceries -->
<button class="category-card flex flex-col items-start p-4 bg-white border border-border-subtle rounded-xl text-left transition-all duration-200 active:scale-95 group relative overflow-hidden" onclick="toggleCategory(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-growth-green" data-icon="shopping_basket">shopping_basket</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Groceries</span>
<div class="check-icon absolute top-3 right-3 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-growth-green" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>

<div class="check-icon absolute top-3 right-3 opacity-0 transition-opacity">

</div>
</button>
<!-- Category: Other -->
<button class="category-card flex flex-col items-start p-4 bg-white border border-border-subtle rounded-xl text-left transition-all duration-200 active:scale-95 group relative overflow-hidden" onclick="toggleCategory(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-4 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-growth-green" data-icon="more_horiz">more_horiz</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Other</span>
<div class="check-icon absolute top-3 right-3 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-growth-green" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- AI Tip Section -->
<div class="mt-stack-lg p-4 bg-surface-container-lowest border border-border-subtle rounded-xl flex gap-3 items-start">
<span class="material-symbols-outlined text-trust-blue mt-0.5" data-icon="auto_awesome">auto_awesome</span>
<div>
<p class="font-label-lg text-label-lg text-on-surface ai-pulse-text">AI Recommendation</p>
<p class="font-body-md text-body-md text-on-surface-variant">Based on your business name, 'TechHub', we suggest starting with <b>Electronics</b>.</p>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white p-gutter-mobile border-t border-border-subtle pb-safe z-50">
<button class="w-full h-14 bg-outline text-white rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all duration-300 opacity-50 cursor-not-allowed active:scale-95" disabled="" id="continue-btn">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</div>
<!-- UI Interaction Logic -->
<script>
        let selectedCount = 0;
        const continueBtn = document.getElementById('continue-btn');

        function toggleCategory(element) {
            element.classList.toggle('active');
            
            // Re-calculate selected count
            selectedCount = document.querySelectorAll('.category-card.active').length;
            
            // Update CTA state
            if (selectedCount > 0) {
                continueBtn.classList.remove('bg-outline', 'opacity-50', 'cursor-not-allowed');
                continueBtn.classList.add('bg-growth-green', 'opacity-100', 'cursor-pointer');
                continueBtn.removeAttribute('disabled');
            } else {
                continueBtn.classList.add('bg-outline', 'opacity-50', 'cursor-not-allowed');
                continueBtn.classList.remove('bg-growth-green', 'opacity-100', 'cursor-pointer');
                continueBtn.setAttribute('disabled', 'true');
            }

            // Haptic-like visual feedback
            if (element.classList.contains('active')) {
                const rect = element.getBoundingClientRect();
                createRipple(element);
            }
        }

        function createRipple(element) {
            const ripple = document.createElement('div');
            ripple.className = 'absolute inset-0 bg-primary opacity-10 rounded-xl animate-ping';
            element.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        }
    </script>
</body></html>
