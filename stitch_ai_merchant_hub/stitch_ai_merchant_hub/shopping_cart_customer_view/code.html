<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shopping Cart</title>

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen pb-32">
<!-- Top App Bar (Transactional intent: back button, no bottom nav) -->
<header class="fixed top-0 w-full z-50 bg-surface flex items-center justify-between px-gutter-mobile h-touch-target-min border-b border-subtle">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 text-primary hover:bg-surface-container-high transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-headline-md text-primary">My Cart</h1>
<span class="font-label-sm text-label-sm text-on-surface-variant">2 Items</span>
</div>
<div class="w-10"></div> <!-- Placeholder for alignment -->
</header>
<main class="pt-20 px-gutter-mobile space-y-stack-lg max-w-2xl mx-auto">
<!-- Cart Items List -->
<section aria-label="Cart Items" class="space-y-stack-md">
<!-- Item 1 -->
<article class="flex items-start gap-4 p-stack-md border border-subtle bg-surface-container-lowest rounded-lg">
<img alt="Minimalist Ceramic Mug" class="w-20 h-20 object-cover rounded-md flex-shrink-0" data-alt="A clean, minimalist product shot of a beautifully crafted white ceramic mug sitting on a light gray surface. The lighting is soft and natural, emphasizing the smooth texture and simple design of the mug. The overall aesthetic is modern, calm, and highly professional, fitting a high-end storefront." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTDzEHeTrSloQxUckInqY5QhimAL1M3GlXcF5J6M5UPVdDnpgex4yoZmWskKZjhBtu_Ippf0c8KLc0M36WncCelWFyTkmvhvWh-8SI2YPk-K0j_gRyD47QXU17CQej1TPSiKyeX_Lh0XTW1py_AlmbS8GzpMV6cWac79qJ9zSOAx6GiSJxCkS9awqaBbLABf6n4p76siNPdZRPXZo722w8hFjEplRJEuzd_ndnCIbImViDCrY5q8giTMsmDHE3N6fDrjdDuxkihNE"/>
<div class="flex-1 flex flex-col justify-between min-h-[5rem]">
<div class="flex justify-between items-start">
<div>
<h2 class="font-body-md text-body-md font-semibold text-on-surface">Minimalist Ceramic Mug</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">PKR 850</p>
</div>
<button aria-label="Remove item" class="text-error hover:bg-error-container p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="flex items-center gap-4 mt-3">
<div class="flex items-center border border-subtle rounded-md">
<button aria-label="Decrease quantity" class="w-8 h-8 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-l-md">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-body-md text-body-md px-3">1</span>
<button aria-label="Increase quantity" class="w-8 h-8 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-r-md">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</article>
<!-- Item 2 -->
<article class="flex items-start gap-4 p-stack-md border border-subtle bg-surface-container-lowest rounded-lg">
<img alt="Cotton Tote Bag" class="w-20 h-20 object-cover rounded-md flex-shrink-0" data-alt="A stylish flat lay image of a natural unbleached cotton tote bag with subtle texture. The bag is placed on a pristine white background with very soft, diffused shadows. The lighting highlights the organic material and premium feel of the product, creating a modern, minimalist e-commerce presentation." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMewx5FEarghRUr92bWW6qQIkrPE2AT4nO3mxwup4v7e7V_9MIjYGoE5JUrPM_80WoxfEL2xehXIes9SkzBiTgcynAHw0i3Wi18PoANB2pVaxxuXw5IJUqxu4bfRBCx7Y7MmXBt1pyomNR1ZK65ttlQGwy6aaxBTPYwPJMrc0katO9YB6jWZQ2s9mrv4qqHmh1a9PGuqRWaS7GbdDV6y2gD9kN5BdX60BT7qw-wtk39VcU6ufXGaxziRu8aaPhJu_KWbK-rWCq1tc"/>
<div class="flex-1 flex flex-col justify-between min-h-[5rem]">
<div class="flex justify-between items-start">
<div>
<h2 class="font-body-md text-body-md font-semibold text-on-surface">Cotton Tote Bag</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">PKR 1,200</p>
</div>
<button aria-label="Remove item" class="text-error hover:bg-error-container p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="flex items-center gap-4 mt-3">
<div class="flex items-center border border-subtle rounded-md">
<button aria-label="Decrease quantity" class="w-8 h-8 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-l-md">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-body-md text-body-md px-3">1</span>
<button aria-label="Increase quantity" class="w-8 h-8 flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-r-md">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</article>
</section>
<!-- Promo Code Section -->
<section aria-label="Promo Code" class="bg-surface-container-lowest border border-subtle rounded-lg p-stack-md">
<label class="sr-only" for="promo_code">Enter promo code</label>
<div class="flex gap-2">
<div class="relative flex-1">
<input class="w-full h-12 px-4 bg-surface rounded-md border border-subtle focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="promo_code" placeholder="Promo code" type="text"/>
</div>
<button class="h-12 px-6 bg-surface-container-high text-on-surface font-label-lg text-label-lg rounded-md hover:bg-surface-variant transition-colors flex items-center justify-center whitespace-nowrap border border-subtle">
                    Apply
                </button>
</div>
</section>
<!-- Delivery Address -->
<section aria-label="Delivery Address" class="bg-surface-container-lowest border border-subtle rounded-lg p-stack-md flex justify-between items-center">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-1">location_on</span>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface-variant mb-1">Deliver to</h3>
<p class="font-body-md text-body-md text-on-surface">House 123, Street 4, Islamabad</p>
</div>
</div>
<button class="text-trust-blue font-label-lg text-label-lg hover:underline underline-offset-4 px-2 py-1">
                Edit
            </button>
</section>
<!-- Order Summary -->
<section aria-label="Order Summary" class="bg-surface-container-lowest border border-subtle rounded-lg p-stack-md space-y-3">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal</span>
<span class="font-body-md text-body-md text-on-surface">PKR 2,050</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Delivery</span>
<span class="font-body-md text-body-md text-growth-green">Free</span>
</div>
<hr class="border-subtle my-2"/>
<div class="flex justify-between items-center">
<span class="font-headline-md text-headline-md text-on-surface">Total</span>
<span class="font-headline-md text-headline-md text-on-surface">PKR 2,050</span>
</div>
</section>
</main>
<!-- Bottom Action Bar (Checkout) -->
<div class="fixed bottom-0 w-full z-40 bg-surface border-t border-subtle p-gutter-mobile">
<div class="max-w-2xl mx-auto">
<button class="w-full min-h-[56px] bg-growth-green text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:bg-primary-container transition-colors active:scale-[0.98] flex items-center justify-center gap-2">
                Proceed to Checkout
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</body></html>
