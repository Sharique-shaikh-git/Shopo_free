<body class="antialiased min-h-screen flex flex-col items-center justify-center font-body-md">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto bg-surface h-screen flex flex-col relative px-gutter-mobile md:px-stack-lg">
<!-- Header -->
<header class="pt-8 pb-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-growth-green text-center">Create Your Shop</h1>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-2">Let's set up your brand identity.</p>
</header>
<!-- Form Content -->
<div class="flex-grow flex flex-col items-center pt-stack-lg space-y-stack-lg w-full">
<!-- Logo Upload -->
<div class="flex flex-col items-center w-full group cursor-pointer">
<div class="w-32 h-32 rounded-full border border-border-subtle bg-surface-gray flex flex-col items-center justify-center transition-colors group-hover:bg-surface-container-low relative overflow-hidden">
<span class="material-symbols-outlined text-growth-green text-4xl mb-1">photo_camera</span>
<span class="font-label-sm text-label-sm text-growth-green">Add Logo</span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-3 text-center">Tap to upload a profile picture</p>
</div>
<!-- Shop Name Input -->
<div class="w-full">
<div class="relative w-full">
<input class="block w-full px-4 pb-2.5 pt-6 text-on-surface bg-transparent border border-border-subtle rounded-lg appearance-none focus:outline-none focus:ring-0 focus:border-growth-green peer min-h-[56px] transition-colors" id="shopName" placeholder=" " type="text"/>
<label class="absolute font-body-md text-body-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] start-4 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4 peer-focus:text-growth-green" for="shopName">Shop Name</label>
</div>
</div>
</div>
<!-- Bottom Action Bar (Thumb Zone) -->
<div class="fixed bottom-0 left-0 w-full md:relative md:w-full border-t border-border-subtle md:border-none bg-surface pb-safe px-gutter-mobile md:px-0 py-4 z-40 flex justify-center mt-auto">
<button class="w-full max-w-md bg-growth-green text-on-primary font-label-lg text-label-lg rounded-lg min-h-[56px] flex items-center justify-center transition-transform active:scale-95">
