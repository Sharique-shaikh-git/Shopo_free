    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar Semantic Shell: Transactional/Task - No BottomNavBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-subtle flat no shadows transition-colors duration-200 h-touch-target-min flex items-center justify-between px-gutter-mobile">
<button aria-label="Go Back" class="h-10 w-10 flex items-center justify-center rounded-full hover:bg-surface-container-high text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary font-bold">Track Order</h1>
<div class="h-10 w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[calc(3rem+1rem)] px-gutter-mobile pb-[calc(3rem+2rem)] flex flex-col gap-stack-lg">
<!-- Order Header Card -->
<section class="bg-surface-container-lowest border border-subtle rounded-xl p-stack-md flex flex-col gap-stack-sm">
<div class="flex justify-between items-start">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Order Number</p>
<h2 class="font-headline-md text-headline-md text-on-surface">#ORD-98765</h2>
</div>
<div class="bg-status-shipped text-growth-green px-3 py-1 rounded-full border border-growth-green/20">
<span class="font-label-sm text-label-sm">Shipped</span>
</div>
</div>
<div class="h-px bg-border-subtle w-full my-1"></div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="schedule">schedule</span>
<p class="font-body-md text-body-md">Expected by Today, 5:00 PM</p>
</div>
</section>
<!-- Status Timeline -->
<section class="bg-surface-container-lowest border border-subtle rounded-xl p-stack-md">
<h3 class="font-label-lg text-label-lg text-on-surface mb-stack-md">Delivery Status</h3>
<div class="relative pl-6">
<!-- Vertical Line connecting nodes -->
<div class="absolute left-[11px] top-4 bottom-8 w-0.5 bg-border-subtle z-0"></div>
<!-- Active Line portion -->
<div class="absolute left-[11px] top-4 h-[calc(100%-4rem)] w-0.5 bg-growth-green z-0"></div>
<!-- Node 1: Order Placed (Done) -->
<div class="relative z-10 flex items-start gap-4 mb-stack-lg">
<div class="w-6 h-6 rounded-full bg-growth-green text-on-primary flex items-center justify-center shrink-0 mt-0.5 ring-4 ring-surface-container-lowest">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill">check</span>
</div>
<div>
<p class="font-label-lg text-label-lg text-on-surface">Order Placed</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Today, 10:30 AM</p>
</div>
</div>
<!-- Node 2: Confirmed (Done) -->
<div class="relative z-10 flex items-start gap-4 mb-stack-lg">
<div class="w-6 h-6 rounded-full bg-growth-green text-on-primary flex items-center justify-center shrink-0 mt-0.5 ring-4 ring-surface-container-lowest">
<span class="material-symbols-outlined text-[14px]" data-icon="check" data-weight="fill">check</span>
</div>
<div>
<p class="font-label-lg text-label-lg text-on-surface">Confirmed</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Today, 11:15 AM</p>
</div>
</div>
<!-- Node 3: Shipped (Current) -->
<div class="relative z-10 flex items-start gap-4 mb-stack-lg">
<div class="w-6 h-6 rounded-full bg-growth-green text-on-primary flex items-center justify-center shrink-0 mt-0.5 ring-4 ring-growth-green/20">
<span class="material-symbols-outlined text-[14px]" data-icon="local_shipping" data-weight="fill">local_shipping</span>
</div>
<div>
<p class="font-label-lg text-label-lg text-growth-green">Shipped</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Out for delivery</p>
</div>
</div>
<!-- Node 4: Delivered (Pending) -->
<div class="relative z-10 flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-surface-variant border-2 border-border-subtle flex items-center justify-center shrink-0 mt-0.5 ring-4 ring-surface-container-lowest">
</div>
<div>
<p class="font-label-lg text-label-lg text-on-surface-variant">Delivered</p>
<p class="font-label-sm text-label-sm text-outline-variant">Pending</p>
</div>
</div>
</div>
</section>
<!-- Package Details Summary -->
<section class="bg-surface-container-lowest border border-subtle rounded-xl p-stack-md flex items-center gap-4">
<div class="w-16 h-16 rounded-lg bg-surface-container-low flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-outline text-3xl" data-icon="inventory_2">inventory_2</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Package Details</p>
<p class="font-body-md text-body-md text-on-surface">3 Items (Clothes &amp; Accessories)</p>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 w-full z-40 bg-surface-container-lowest border-t border-subtle p-gutter-mobile shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full h-[56px] rounded-lg bg-whatsapp-green text-white font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" data-icon="chat" data-weight="fill">chat</span>
            Chat on WhatsApp
        </button>
</footer>
</body></html>
