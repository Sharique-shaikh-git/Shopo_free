<div class="absolute inset-0 w-full h-full pointer-events-none opacity-40" style="display:block;">
<canvas id="shader-canvas-ANIMATION_34" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_34');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

void main() {
    vec2 uv = v_texCoord;
    
    // Create a pulse effect
    float pulse = 0.5 + 0.5 * sin(u_time * 2.0);
    
    // Create moving organic shapes using sine/cosine
    float noise = sin(uv.x * 10.0 + u_time) * cos(uv.y * 10.0 - u_time * 0.5);
    noise += sin(uv.y * 15.0 + u_time * 0.8) * cos(uv.x * 8.0 + u_time * 1.2);
    
    // Growth green color (#006b5e) derived from design system
    vec3 color1 = vec3(0.0, 0.42, 0.37); 
    // Lighter emerald green for highlight
    vec3 color2 = vec3(0.1, 0.8, 0.5);
    
    vec3 finalColor = mix(color1, color2, noise * 0.5 + 0.5);
    finalColor *= (0.8 + 0.2 * pulse);
    
    // Mask for a subtle edge glow or just fill
    float alpha = 0.6;
    
    gl_FragColor = vec4(finalColor, alpha);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loading = document.getElementById('description-loading');
                const textarea = document.getElementById('product-description');
                const label = document.querySelector('label[for="product-description"]');
                
                loading.classList.add('hidden');
                textarea.classList.remove('hidden');
                
                // Simulate form focus effect on the description after load
                textarea.classList.add('border-growth-green', 'border-2');
                textarea.classList.remove('border-border-subtle', 'border');
                label.classList.add('text-growth-green');
                label.classList.remove('text-on-surface-variant');

                // Remove highlight after a moment to show normal state
                setTimeout(() => {
                    textarea.classList.remove('border-growth-green', 'border-2');
                    textarea.classList.add('border-border-subtle', 'border');
                    label.classList.remove('text-growth-green');
                    label.classList.add('text-on-surface-variant');
                }, 1500);

            }, 2500); // Simulate 2.5s of AI generation
