<script>
        // Simple micro-interaction for input formatting
        const phoneInput = document.getElementById('phone-number');
        const sendBtn = document.getElementById('send-code-btn');

        phoneInput.addEventListener('input', (e) => {
            // Remove non-numeric characters
            let val = e.target.value.replace(/\D/g, '');
            
            // Limit to 10 digits (Standard Pak mobile length without prefix)
            if (val.length > 10) val = val.slice(0, 10);
            
            e.target.value = val;

            // Simple visual feedback for button state
            if (val.length >= 10) {
                sendBtn.classList.remove('opacity-60');
                sendBtn.classList.add('bg-growth-green');
            } else {
                sendBtn.classList.add('opacity-60');
            }
        });

        // Initialize state
        sendBtn.classList.add('opacity-60');

        // Button click feedback
        sendBtn.addEventListener('click', () => {
            if (phoneInput.value.length >= 10) {
                sendBtn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Sending...</span>
                `;
                setTimeout(() => {
                    // Reset or transition to OTP screen (simulated)
                    alert('OTP Sent to +92 ' + phoneInput.value);
                    sendBtn.innerHTML = '<span>Send Code</span><span class="material-symbols-outlined text-white">chevron_right</span>';
                }, 2000);
            }
        });
    </script>
