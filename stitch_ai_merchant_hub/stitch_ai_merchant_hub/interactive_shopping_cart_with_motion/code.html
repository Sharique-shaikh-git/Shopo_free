<style>
    body {
      min-height: max(884px, 100dvh);
    }
    
    @keyframes slideUpIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideLeftOut {
        from { opacity: 1; transform: translateX(0); height: auto; margin-bottom: 1rem; padding: 1rem; border-width: 1px; }
        to { opacity: 0; transform: translateX(-100%); height: 0; margin-bottom: 0; padding: 0; border-width: 0; overflow: hidden; }
    }
    
    @keyframes pulseScale {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }

    .animate-slide-up {
        animation: slideUpIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        opacity: 0;
        will-change: transform, opacity;
    }
    
    .animate-slide-up-fab {
        animation: slideUpIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 0.6s;
        opacity: 0;
        will-change: transform, opacity;
    }

    .animate-slide-left-out {
        animation: slideLeftOut 0.4s ease-in forwards;
        will-change: transform, opacity, height, margin, padding;
    }
    
    .animate-pulse-scale {
        animation: pulseScale 0.3s ease-out;
        will-change: transform;
    }
  </style>

<!-- Bottom Action Bar (Checkout) -->
<div class="animate-slide-up-fab fixed bottom-0 w-full z-40 bg-surface border-t border-subtle p-gutter-mobile">
<div class="max-w-2xl mx-auto">
<button class="w-full min-h-[56px] bg-growth-green text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-2 origin-center" id="checkout-btn">
                Proceed to Checkout
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const triggerAnimation = (el, animationClass) => {
            el.classList.remove(animationClass);
            void el.offsetWidth; // trigger reflow
            el.classList.add(animationClass);
        };

        // Quantity Buttons
        const qtyBtns = document.querySelectorAll('.qty-btn');
        const checkoutBtn = document.getElementById('checkout-btn');

        qtyBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const qtyVal = e.target.closest('.border-subtle').querySelector('.qty-val');
                
                // Add pulse scale to quantity number
                if (qtyVal) triggerAnimation(qtyVal, 'animate-pulse-scale');
                
                // Add pulse scale to checkout button
                if (checkoutBtn) triggerAnimation(checkoutBtn, 'animate-pulse-scale');
            });
        });

        // Delete Buttons
        const deleteBtns = document.querySelectorAll('.delete-btn');
        deleteBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const article = e.target.closest('article');
                if (article) {
                    article.classList.add('animate-slide-left-out');
                    setTimeout(() => {
                        article.remove();
                    }, 400); // Wait for animation to finish
                }
            });
        });
    });
</script>
