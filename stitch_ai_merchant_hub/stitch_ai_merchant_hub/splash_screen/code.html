<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f9f9fc;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Subtle Entrance Animations */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes scale-in {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .animate-fade-up { animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-scale-in { animation: scale-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pulse-slow { animation: pulse-subtle 3s ease-in-out infinite; }

        /* Hidden initially for animation stagger */
        .reveal-delay-1 { animation-delay: 0.2s; opacity: 0; }
        .reveal-delay-2 { animation-delay: 0.4s; opacity: 0; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col items-center justify-center min-h-screen p-gutter-mobile">
<!-- Top Glow Ornament (Subtle AI/Growth Hint) -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-lg h-64 bg-gradient-to-b from-primary-fixed/20 to-transparent blur-3xl pointer-events-none opacity-50"></div>
<!-- Main Branding Content -->
<main class="relative flex flex-col items-center text-center space-y-stack-md z-10">
<!-- App Logo Container -->
<div class="animate-scale-in flex items-center justify-center w-24 h-24 rounded-3xl bg-surface-container-lowest border border-border-subtle shadow-sm mb-stack-sm">
<span class="material-symbols-outlined text-[48px] text-growth-green" data-icon="storefront">storefront</span>
</div>
<!-- App Name -->
<div class="animate-fade-up reveal-delay-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-growth-green tracking-tight">
                Shop Builder
            </h1>
</div>
</main>
<!-- Bottom Content (Subtitle & Status) -->
<footer class="absolute bottom-16 w-full px-gutter-mobile text-center flex flex-col items-center space-y-4">
<!-- Tagline -->
<p class="animate-fade-up reveal-delay-2 font-body-md text-body-md text-on-surface-variant max-w-[280px]">
            Build your online business in seconds.
        </p>
<!-- Loading Indicator -->
<div class="animate-fade-up reveal-delay-2 pt-4 flex flex-col items-center gap-3">
<div class="flex space-x-1.5">
<div class="w-2 h-2 rounded-full bg-growth-green/20 animate-bounce" style="animation-delay: 0.1s"></div>
<div class="w-2 h-2 rounded-full bg-growth-green/40 animate-bounce" style="animation-delay: 0.2s"></div>
<div class="w-2 h-2 rounded-full bg-growth-green/60 animate-bounce" style="animation-delay: 0.3s"></div>
</div>
<span class="font-label-sm text-label-sm text-outline animate-pulse-slow uppercase tracking-widest">Initialising</span>
</div>
</footer>
<!-- Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] z-0 overflow-hidden" style="background-image: radial-gradient(#006B5E 0.5px, transparent 0.5px); background-size: 24px 24px;">
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: Simulate transition to home screen after delay
            // setTimeout(() => {
            //     window.location.href = '/home';
            // }, 3000);

            // Subtle parallax effect on logo
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                const logo = document.querySelector('.animate-scale-in');
                if(logo) {
                    logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        });
    </script>
</body></html>
