name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build Shared
      run: pnpm --filter @shopo/shared build
      
    - name: Build Database
      run: pnpm --filter @shopo/database build

    - name: Typecheck Shared
      run: pnpm --filter @shopo/shared typecheck
      
    - name: Typecheck Database
      run: pnpm --filter @shopo/database typecheck
      
    - name: Typecheck API
      run: pnpm --filter @shopo/api exec tsc --noEmit
      
    - name: Build API
      run: pnpm --filter @shopo/api build
      
    - name: Build Worker
      run: pnpm --filter @shopo/worker build
      
    - name: Build Storefront
      run: pnpm --filter storefront-web build
